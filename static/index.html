<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labeling Lab</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Labeling Lab</h1>
      <nav aria-label="Sections">
        <button data-tab="data" type="button">Data</button>
        <button data-tab="review" type="button">Review</button>
      </nav>

      <section id="data">
        <p><button data-pipeline="search">Collect</button> <button data-pipeline="fetch">Fetch</button> <button data-pipeline="label">Auto-label</button> <button data-pipeline="apply-reviews">Apply reviews</button></p>
        <details><summary>Options and log</summary><label>Limit <input id="pipeline-limit" type="number" min="1" value="1500" /></label> <label>Workers <input id="pipeline-workers" type="number" min="1" value="4" /></label> <label>Teacher model <input id="pipeline-model" value="qwen2.5:7b" /></label><pre id="pipeline-output">No job started.</pre></details>
      </section>

      <section id="review" hidden>
        <p><label>Review <select id="candidate-mode"><option value="teacher">JSONL batch</option><option value="pages">Page candidates</option><option value="links">Link candidates</option></select></label> <button id="load-review" type="button">Load next</button> <strong id="review-counter" aria-live="polite"></strong></p>
        <p><label>Batch <input id="review-path" value="data/final/evaluation/page/candidates.jsonl" /></label></p>
        <div id="item">No item loaded.</div>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script src="/static/app.js?v=2"></script>
  </body>
</html>
