<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labeling Lab</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Labeling Lab</h1>
      <nav aria-label="Sections">
        <button data-tab="data" type="button">Data</button>
        <button data-tab="review" type="button">Review</button>
        <button data-tab="evaluate" type="button">Evaluate</button>
      </nav>

      <section id="data">
        <p><button data-pipeline="search">Collect</button> <button data-pipeline="fetch">Fetch</button> <button data-pipeline="label">Auto-label</button> <button data-pipeline="apply-reviews">Apply reviews</button></p>
        <details><summary>Options and log</summary><label>Limit <input id="pipeline-limit" type="number" min="1" value="1500" /></label> <label>Workers <input id="pipeline-workers" type="number" min="1" value="4" /></label> <label>Teacher model <input id="pipeline-model" value="qwen2.5:7b" /></label><pre id="pipeline-output">No job started.</pre></details>
      </section>

      <section id="review" hidden>
        <p><label>Review <select id="candidate-mode"><option value="pages">Page candidates</option><option value="links">Link candidates</option><option value="teacher">Teacher batches</option></select></label> <button id="load-review" type="button">Load next</button></p>
        <div id="item">No item loaded.</div>
      </section>

      <section id="evaluate" hidden>
        <p><label>Snapshot <input id="snapshot" placeholder="data/benchmarks/run/features.jsonl" /></label></p>
        <p><label>Baseline page <input id="baseline-page" value="../search-engine/verdict-ml/artifacts/page_verdict_handlabeled.joblib" /></label></p>
        <p><label>Candidate page <input id="candidate-page" value="data/models/page_verdict.joblib" /></label></p>
        <p><label>Baseline link <input id="baseline-link" value="../search-engine/verdict-ml/artifacts/link_verdict.joblib" /></label></p>
        <p><label>Candidate link <input id="candidate-link" value="data/models/link_verdict.joblib" /></label></p>
        <p><button id="evaluate-run" type="button">Replay and create review queue</button> <button id="live-smoke" type="button">Run live smoke</button></p>
        <div id="evaluation">No comparison run.</div>
        <div id="queue"></div>
        <p id="decision" hidden>Human decision: <button data-decision="keep_baseline">Keep baseline</button> <button data-decision="release_candidate">Release candidate</button> <button data-decision="needs_more_review">More review</button></p>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
