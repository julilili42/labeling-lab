[project]
name = "labeling-lab"
version = "0.1.0"
description = "Local labeling, review, and model-training lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "joblib==1.5.3",
    "scikit-learn==1.9.0",
]

[project.scripts]
auto-label = "auto_labeling.cli:main"
labeling-lab = "labeling_lab.server:main"

[dependency-groups]
dev = ["pytest>=9.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_labeling", "src/labeling_lab"]
